[package]
name = "music-decryptor"
version = "1.2.0"
edition = "2021"

[lib]
name = "music_decryptor_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
notify = "6"
flate2 = "1"

[profile.release]
opt-level = 3
# Thin LTO keeps the optimized release build while avoiding the very high
# peak memory usage of full-link-time optimization on Windows/MinGW.
lto = "thin"
codegen-units = 16
