<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐解密转换工具</title>
<style>
:root{--bg-base:#0f0e17;--bg-elevated:#1a1925;--bg-card:#211f30;--bg-hover:#2a283a;--border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);--text-primary:#fffffe;--text-secondary:#a7a9be;--text-muted:#6b6d80;--accent:#e4adf4;--accent-2:#8c5ce6;--accent-glow:rgba(228,173,244,0.15);--success:#95e1a3;--success-bg:rgba(149,225,163,0.1);--error:#ff8e8e;--pending:#ffd06b;--radius:14px;--radius-sm:10px;--shadow:0 4px 24px rgba(0,0,0,0.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg-base);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;background-image:radial-gradient(ellipse 600px 400px at 20% -10%,rgba(140,92,230,0.08),transparent),radial-gradient(ellipse 500px 300px at 90% 10%,rgba(228,173,244,0.05),transparent)}
.app{max-width:780px;margin:0 auto;padding:32px 24px 48px;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:14px;padding:4px 0 28px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(140,92,230,0.3)}
.logo svg{width:24px;height:24px;color:#fff}
.header h1{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.header .sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.monitor-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;transition:border-color 0.2s}
.monitor-card.active{border-color:rgba(149,225,163,0.25);box-shadow:0 0 20px rgba(149,225,163,0.06)}
.monitor-header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.monitor-left{display:flex;align-items:center;gap:12px}
.monitor-icon{width:38px;height:38px;border-radius:10px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all 0.2s}
.monitor-card.active .monitor-icon{background:var(--success-bg);color:var(--success)}
.monitor-icon svg{width:20px;height:20px}
.monitor-title{font-weight:600;font-size:15px}
.monitor-status{font-size:12px;color:var(--text-muted);margin-top:2px}
.monitor-card.active .monitor-status{color:var(--success)}
.toggle{position:relative;width:46px;height:26px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;cursor:pointer;transition:all 0.25s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-muted);transition:all 0.25s}
.toggle.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent}
.toggle.on::after{transform:translateX(20px);background:#fff}
.monitor-dir{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
.monitor-dir svg{width:14px;height:14px;flex-shrink:0;color:var(--text-muted)}
.monitor-dir span{font-family:monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-feed{margin-top:12px;max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.activity-feed:empty{display:none}
.activity-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-card);border-radius:var(--radius-sm);font-size:13px;animation:slideIn 0.2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.activity-dot.detect{background:var(--pending)}
.activity-dot.success{background:var(--success)}
.activity-dot.error{background:var(--error)}
.activity-item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.activity-item .msg{font-size:12px;color:var(--text-muted);white-space:nowrap}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all 0.25s;background:var(--bg-elevated);position:relative;overflow:hidden}
.upload-zone::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,var(--accent-glow),transparent);opacity:0;transition:opacity 0.3s}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--bg-card)}
.upload-zone:hover::before,.upload-zone.dragover::before{opacity:1}
.upload-zone .ico{width:56px;height:56px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:color 0.25s;position:relative}
.upload-zone:hover .ico,.upload-zone.dragover .ico{color:var(--accent)}
.upload-zone .ico svg{width:56px;height:56px}
.upload-zone p{color:var(--text-secondary);font-size:14px;position:relative}
.upload-zone .link{color:var(--accent);font-weight:600}
.upload-zone .hint{font-size:12px;color:var(--text-muted);margin-top:8px;position:relative}
.section-title{font-size:16px;font-weight:700;margin:32px 0 16px;display:flex;align-items:center;gap:10px}
.section-title svg{width:18px;height:18px;color:var(--accent)}
.section-title .count{font-size:12px;color:var(--text-secondary);background:var(--bg-card);padding:3px 12px;border-radius:20px;border:1px solid var(--border)}
.file-list{display:flex;flex-direction:column;gap:10px}
.file-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);transition:border-color 0.2s}
.file-item:hover{border-color:var(--border-hover)}
.file-item .ficon{width:20px;height:20px;flex-shrink:0;color:var(--text-muted)}
.file-item .info{flex:1;min-width:0}
.file-item .fname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .fmeta{font-size:12px;color:var(--text-muted);margin-top:3px}
.file-item .status{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.file-item .status.pending{color:var(--pending)}
.file-item .status.done{color:var(--success)}
.file-item .status.error{color:var(--error)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-dl{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;text-decoration:none;box-shadow:0 2px 8px rgba(140,92,230,0.25)}
.btn-dl:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(140,92,230,0.35)}
.btn-dl svg{width:14px;height:14px}
.song-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all 0.2s}
.song-card:hover{border-color:var(--border-hover);background:var(--bg-hover)}
.song-card .sicon{width:44px;height:44px;flex-shrink:0;border-radius:var(--radius-sm);background:linear-gradient(135deg,rgba(140,92,230,0.15),rgba(228,173,244,0.1));color:var(--accent);display:flex;align-items:center;justify-content:center}
.song-card .sicon svg{width:22px;height:22px}
.song-card .sinfo{flex:1;min-width:0}
.song-card .sname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card .smeta{font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.song-card .badges{display:flex;gap:6px;flex-shrink:0}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;white-space:nowrap}
.badge.quality{background:var(--accent-glow);color:var(--accent)}
.badge.has-key{background:var(--success-bg);color:var(--success)}
.library-empty{text-align:center;padding:32px 16px;color:var(--text-muted);font-size:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm)}
.footer{margin-top:auto;padding-top:36px;text-align:center}
.footer p{font-size:12px;color:var(--text-muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-primary);padding:12px 24px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow);border:1px solid var(--border-hover);opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div><h1>音乐解密转换工具</h1><div class="sub">支持酷狗 KGG 加密格式 · 自动转换为 MP3</div></div>
  </header>
  <div class="monitor-card" id="monCard">
    <div class="monitor-header">
      <div class="monitor-left">
        <div class="monitor-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div><div class="monitor-title">自动监控</div><div class="monitor-status" id="monStatus">未启用 · 下载后手动转换</div></div>
      </div>
      <div class="toggle" id="monToggle"></div>
    </div>
    <div class="monitor-dir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span id="monDir">正在检测酷狗下载目录...</span>
    </div>
    <div class="activity-feed" id="monFeed"></div>
  </div>
  <main>
    <div class="upload-zone" id="zone">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <p>拖拽加密音乐文件到这里，或 <span class="link">点击选择</span></p>
      <div class="hint">支持 KGG 格式 · 自动解密输出</div>
      <input type="file" id="input" multiple accept=".kgg" hidden>
    </div>
    <div class="file-list" id="list"></div>
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      歌曲库 <span class="count" id="songCount">加载中...</span>
    </div>
    <div id="library" style="display:flex;flex-direction:column;gap:10px"></div>
  </main>
  <footer class="footer"><p>所有解密与转换均在本地完成，不会上传到任何服务器</p></footer>
</div>
<div class="toast" id="toast"></div>
<script>
var isTauri = !!(window.__TAURI__);
var invoke = isTauri ? window.__TAURI__.core.invoke : null;
var zone=document.getElementById('zone'),input=document.getElementById('input'),list=document.getElementById('list'),toast=document.getElementById('toast'),library=document.getElementById('library'),songCount=document.getElementById('songCount');
var monToggle=document.getElementById('monToggle'),monCard=document.getElementById('monCard'),monStatus=document.getElementById('monStatus'),monDir=document.getElementById('monDir'),monFeed=document.getElementById('monFeed');
var monitorOn=false, kugouDir='';

function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toast.classList.remove('show')},3000)}
function formatSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function formatDuration(ms){if(!ms)return'--:--';var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function formatBitrate(br){return br?Math.round(br/1000)+' kbps':''}
function fileToUint8(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(new Uint8Array(r.result))};r.onerror=reject;r.readAsArrayBuffer(file)})}
function downloadBytes(data,name){var blob=new Blob([data]);var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}

// ---- Monitor ----
if(isTauri){
  invoke('get_kugou_dir').then(function(dir){
    if(dir){ kugouDir=dir; monDir.textContent=dir; }
    else { monDir.textContent='未找到酷狗下载目录'; }
  });
  window.__TAURI__.event.listen('monitor-event',function(ev){
    var p=ev.payload; addActivity(p.event_type,p.filename,p.message);
  });
}

function addActivity(type,name,msg){
  var item=document.createElement('div');item.className='activity-item';
  var dotClass=type==='success'?'success':type==='error'?'error':'detect';
  item.innerHTML='<div class="activity-dot '+dotClass+'"></div><div class="name">'+name+'</div><div class="msg">'+msg+'</div>';
  monFeed.insertBefore(item,monFeed.firstChild);
  while(monFeed.children.length>20){monFeed.removeChild(monFeed.lastChild)}
}

monToggle.addEventListener('click',async function(){
  if(!isTauri){showToast('请使用桌面版');return}
  if(!monitorOn){
    if(!kugouDir){showToast('未找到酷狗下载目录');return}
    try{
      await invoke('start_monitor',{watchDir:kugouDir,outputDir:kugouDir});
      monitorOn=true;monToggle.classList.add('on');monCard.classList.add('active');
      monStatus.textContent='监控中 · 下载完成后自动转换';
      showToast('自动监控已开启');
    }catch(e){showToast('启动失败: '+e)}
  }else{
    try{
      await invoke('stop_monitor');
      monitorOn=false;monToggle.classList.remove('on');monCard.classList.remove('active');
      monStatus.textContent='未启用 · 下载后手动转换';
      showToast('自动监控已关闭');
    }catch(e){showToast('停止失败: '+e)}
  }
});

// ---- Manual decrypt ----
function addFile(file){
  var item=document.createElement('div');item.className='file-item';
  item.innerHTML='<svg class="ficon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><div class="info"><div class="fname">'+file.name+'</div><div class="fmeta">'+formatSize(file.size)+'</div></div><div class="status pending"><span class="spinner"></span>处理中</div>';
  list.appendChild(item);processFile(file,item)
}
async function processFile(file,item){
  var statusEl=item.querySelector('.status');
  try{
    var result;
    if(isTauri){
      var bytes=await fileToUint8(file);
      result=await invoke('decrypt_kgg',{fileData:Array.from(bytes),filename:file.name});
      var ext=result.format;
      var outName=result.title+'.'+ext;
      downloadBytes(new Uint8Array(result.audio),outName);
      statusEl.className='status done';statusEl.textContent='已保存';
      item.querySelector('.fmeta').textContent=formatSize(file.size)+' → '+formatSize(result.audio.length);
    }else{
      var fd=new FormData();fd.append('file',file);
      var r=await fetch('/api/convert',{method:'POST',body:fd});var data=await r.json();
      if(!r.ok)throw new Error(data.detail||'处理失败');
      statusEl.className='status done';statusEl.innerHTML='';
      var a=document.createElement('a');a.className='btn-dl';a.href='/api/download/'+data.token;a.download=data.filename;
      a.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载 MP3';
      item.querySelector('.fmeta').textContent=formatSize(file.size)+' → '+formatSize(data.size);
      item.querySelector('.info').insertAdjacentElement('afterend',a)
    }
  }catch(e){statusEl.className='status error';statusEl.textContent=e.message;item.style.borderColor='var(--error)'}
}
['dragenter','dragover'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.add('dragover')})});
['dragleave','drop'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.remove('dragover')})});
zone.addEventListener('drop',function(e){var files=[].slice.call(e.dataTransfer.files);if(!files.length)return;var kgg=files.filter(function(f){return f.name.toLowerCase().endsWith('.kgg')});if(kgg.length<files.length)showToast('已忽略不支持的文件格式');kgg.forEach(addFile)});
zone.addEventListener('click',function(){input.click()});
input.addEventListener('change',function(e){[].slice.call(e.target.files).forEach(addFile);input.value=''});

async function loadLibrary(){
  try{
    var data;
    if(isTauri){data=await invoke('get_songs');}
    else{var r=await fetch('/api/songs');data=await r.json();}
    if(!data.success){songCount.textContent='0';library.innerHTML='<div class="library-empty">'+(data.error||'无法加载歌曲库')+'</div>';return}
    songCount.textContent=data.total+' 首';
    if(!data.songs||!data.songs.length){library.innerHTML='<div class="library-empty">数据库中没有可解密的歌曲</div>';return}
    library.innerHTML=data.songs.map(function(s){
      var p=[];if(s.bitrate)p.push(formatBitrate(s.bitrate));if(s.duration_ms)p.push(formatDuration(s.duration_ms));if(s.file_size)p.push(formatSize(s.file_size));
      var q=s.quality?'<span class="badge quality">'+s.quality+'k</span>':'';
      return '<div class="song-card"><div class="sicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="sinfo"><div class="sname">'+s.display_name+'</div><div class="smeta">'+p.join(' · ')+'</div></div><div class="badges">'+q+'<span class="badge has-key">有密钥</span></div></div>'
    }).join('')
  }catch(e){songCount.textContent='0';library.innerHTML='<div class="library-empty">加载歌曲库失败</div>'}
}
loadLibrary();
</script>
</body>
</html>
